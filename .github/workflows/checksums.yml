name: Repair release checksums
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published version tag
        required: true
        default: v0.2.1
        type: string
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hash published binaries and upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern '*.exe' --pattern '*.zip' --dir release
          cd release
          sha256sum *.exe *.zip > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber --repo "$GH_REPO"
