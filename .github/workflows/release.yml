name: Publish Windows release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to build and publish (for example v0.2.1)'
        required: true
        default: v0.2.1
        type: string
permissions:
  contents: write
concurrency:
  group: windows-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and Electron
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Check shortcut and driver validation
        run: npm test
      - name: Verify desktop startup and playback
        run: npm run test:desktop
      - name: Check live public sound library
        continue-on-error: true
        run: node scripts/check-library.mjs
      - name: Build Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm run package:win 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/waveform-zip.log"
          if ($LASTEXITCODE -ne 0) {
            $message = ((Get-Content "$env:RUNNER_TEMP/waveform-zip.log" | Select-Object -Last 30) -join "`n").Replace('%','%25').Replace("`n",'%0A').Replace("`r",'%0D')
            Write-Output "::error title=Windows ZIP build failed::$message"
            exit 1
          }
      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm run package:installer 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/waveform-installer.log"
          if ($LASTEXITCODE -ne 0) {
            $message = ((Get-Content "$env:RUNNER_TEMP/waveform-installer.log" | Select-Object -Last 30) -join "`n").Replace('%','%25').Replace("`n",'%0A').Replace("`r",'%0D')
            Write-Output "::error title=Windows installer build failed::$message"
            exit 1
          }
      - name: Create checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.exe' }
          if ($assets.Count -ne 2) { throw 'Expected the ZIP and installer' }
          $assets | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $assetName = $_.Name.Replace(' ','.')
            "$hash  $assetName"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_REF -notmatch '^v\d+\.\d+\.\d+$') { throw 'Run this workflow from a version tag such as v0.1.0' }
          $assets = @((Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.exe' }).FullName) + @('release/SHA256SUMS.txt')
          gh release view $env:RELEASE_REF --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_REF @assets --clobber --repo $env:GH_REPO
          } else {
            gh release create $env:RELEASE_REF @assets --verify-tag --prerelease --title "Waveform $env:RELEASE_REF for Windows" --notes-file "docs/release-$env:RELEASE_REF.md" --repo $env:GH_REPO
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
