name: Publish Windows release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and Electron
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Check shortcut and driver validation
        run: npm test
      - name: Verify desktop startup and playback
        run: npm run test:desktop
      - name: Build Windows ZIP and installer
        run: |
          npm run package:win
          npm run package:installer
      - name: Create checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.exe' }
          if ($assets.Count -ne 2) { throw 'Expected the ZIP and installer' }
          $assets | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_REF -notmatch '^v\d+\.\d+\.\d+$') { throw 'Run this workflow from a version tag such as v0.1.0' }
          $assets = @((Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.exe' }).FullName) + @('release/SHA256SUMS.txt')
          gh release view $env:RELEASE_REF --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_REF @assets --clobber --repo $env:GH_REPO
          } else {
            gh release create $env:RELEASE_REF @assets --verify-tag --prerelease --title "Waveform $env:RELEASE_REF for Windows" --notes-file docs/release-v0.1.0.md --repo $env:GH_REPO
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
